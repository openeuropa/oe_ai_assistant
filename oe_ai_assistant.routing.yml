# Plugin dispatch route: handles all plugin API calls.
oe_ai_assistant.plugin.dispatch:
  path: /api/ai/plugins/{plugin_id}/{action}
  defaults:
    _controller: \Drupal\oe_ai_assistant\Controller\PluginController::dispatch
  methods: [POST]
  requirements:
    _permission: 'use oe ai assistant'
    plugin_id: '[a-z][a-z0-9_-]*'
    action: '[a-z][a-z0-9_-]*'

# Node tab route: renders the AI Assistant page on nodes.
oe_ai_assistant.node_tab:
  path: /node/{node}/ai-assistant
  defaults:
    _controller: \Drupal\oe_ai_assistant\Controller\NodeTabController::content
    _title: 'AI Assistant'
  requirements:
    _permission: 'use oe ai assistant'
    node: \d+
  options:
    _admin_route: TRUE
    parameters:
      node:
        type: entity:node

# Node add tab route: renders the AI Assistant on the node creation form.
oe_ai_assistant.node_add_tab:
  path: /node/add/{node_type}/ai-assistant
  defaults:
    _controller: \Drupal\oe_ai_assistant\Controller\NodeTabController::addContent
    _title: 'AI Assistant'
  requirements:
    _permission: 'use oe ai assistant'
  options:
    _admin_route: TRUE
    parameters:
      node_type:
        type: entity:node_type
