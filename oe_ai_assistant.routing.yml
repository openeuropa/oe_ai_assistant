# Plugin dispatch route: handles all plugin API calls.
oe_ai_assistant.admin_config:
  path: /admin/config/ai-editorial
  defaults:
    _controller: '\Drupal\oe_ai_assistant\Controller\AiEditorialSessionController::adminConfigPage'
    _title: 'AI Editorial Assistant'
  requirements:
    _permission: 'administer ai editorial sessions'
  options:
    _admin_route: TRUE

oe_ai_assistant.plugin.dispatch:
  path: /api/ai/plugins/{plugin_id}/{action}
  defaults:
    _controller: \Drupal\oe_ai_assistant\Controller\PluginController::dispatch
  methods: [POST]
  requirements:
    _permission: 'use oe ai assistant'
    plugin_id: '[a-z][a-z0-9_-]*'
    action: '[a-z][a-z0-9_-]*'

# Node tab route: renders the AI Assistant page on nodes.
oe_ai_assistant.node_tab:
  path: /node/{node}/ai-assistant
  defaults:
    _controller: \Drupal\oe_ai_assistant\Controller\NodeTabController::content
    _title: 'AI Assistant'
  requirements:
    _permission: 'use oe ai assistant'
    node: \d+
  options:
    _admin_route: TRUE
    parameters:
      node:
        type: entity:node

# Node add tab route: renders the AI Assistant on the node creation form.
oe_ai_assistant.node_add_tab:
  path: /node/add/{node_type}/ai-assistant
  defaults:
    _controller: \Drupal\oe_ai_assistant\Controller\NodeTabController::addContent
    _title: 'AI Assistant'
  requirements:
    _permission: 'use oe ai assistant'
  options:
    _admin_route: TRUE
    parameters:
      node_type:
        type: entity:node_type

# Content schema route: returns the JSON Schema for an entity type/bundle.
oe_ai_assistant.content_schema:
  path: /api/ai/content-schema/{entity_type_id}/{bundle}
  defaults:
    _controller: \Drupal\oe_ai_assistant\Controller\ContentSchemaController::get
  methods: [GET]
  requirements:
    _permission: 'use oe ai assistant'
    entity_type_id: '[a-z][a-z0-9_]*'
    bundle: '[a-z][a-z0-9_]*'
