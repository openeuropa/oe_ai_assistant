# Plugin dispatch route: handles all plugin API calls.
oe_ai_assistant.admin_settings:
  path: /admin/config/ai-editorial
  defaults:
    _controller: '\Drupal\oe_ai_assistant\Controller\AiEditorialSessionController::adminConfigPage'
    _title: 'AI Editorial Tools'
  requirements:
    _permission: 'administer ai editorial sessions'

oe_ai_assistant.plugin.dispatch:
  path: /api/ai/plugins/{plugin_id}/{action}
  defaults:
    _controller: \Drupal\oe_ai_assistant\Controller\PluginController::dispatch
  methods: [POST]
  requirements:
    _permission: 'use oe ai assistant'
    plugin_id: '[a-z][a-z0-9_-]*'
    action: '[a-z][a-z0-9_-]*'

# Content schema route: returns the JSON Schema for an entity type/bundle.
oe_ai_assistant.content_schema:
  path: /api/ai/content-schema/{entity_type_id}/{bundle}
  defaults:
    _controller: \Drupal\oe_ai_assistant\Controller\ContentSchemaController::get
  methods: [GET]
  requirements:
    _permission: 'use oe ai assistant'
    entity_type_id: '[a-z][a-z0-9_]*'
    bundle: '[a-z][a-z0-9_]*'

# Templates
entity.ai_drafting_template.collection:
  path: '/admin/config/ai-editorial/templates'
  defaults:
    _entity_list: 'ai_drafting_template'
    _title: 'AI Drafting template configuration'
  requirements:
    _permission: 'administer ai_drafting_template'

entity.ai_drafting_template.add_form:
  path: '/admin/config/ai-editorial/templates/add'
  defaults:
    _entity_form: 'ai_drafting_template.add'
    _title: 'Add an ai drafting template'
  requirements:
    _permission: 'administer ai_drafting_template'

entity.ai_drafting_template.edit_form:
  path: '/admin/config/ai-editorial/templates/{ai_drafting_template}'
  defaults:
    _entity_form: 'ai_drafting_template.edit'
    _title: 'Edit an ai drafting template'
  requirements:
    _permission: 'administer ai_drafting_template'

entity.ai_drafting_template.delete_form:
  path: '/admin/config/ai-editorial/templates/{ai_drafting_template}/delete'
  defaults:
    _entity_form: 'ai_drafting_template.delete'
    _title: 'Delete an ai drafting template'
  requirements:
    _permission: 'administer ai_drafting_template'

# AI conversation messages
entity.ai_conversation_message.collection:
  path: '/admin/config/ai-editorial/messages'
  defaults:
    _entity_list: 'ai_conversation_message'
    _title: 'AI conversation messages'
  requirements:
    _permission: 'access ai conversation message overview+administer ai conversation messages'

entity.ai_conversation_message.add_form:
  path: '/admin/config/ai-editorial/messages/add'
  defaults:
    _entity_form: 'ai_conversation_message.add'
    _title: 'Add conversation message'
  requirements:
    _entity_create_access: 'ai_conversation_message'

entity.ai_conversation_message.edit_form:
  path: '/admin/config/ai-editorial/messages/{ai_conversation_message}/edit'
  defaults:
    _entity_form: 'ai_conversation_message.edit'
    _title: 'Edit conversation message'
  requirements:
    _entity_access: 'ai_conversation_message.update'

entity.ai_conversation_message.delete_form:
  path: '/admin/config/ai-editorial/messages/{ai_conversation_message}/delete'
  defaults:
    _entity_form: 'ai_conversation_message.delete'
    _title: 'Delete conversation message'
  requirements:
    _entity_access: 'ai_conversation_message.delete'
