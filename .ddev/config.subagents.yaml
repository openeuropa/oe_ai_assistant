web_extra_daemons:
  - name: subagent-worker
    command: "bash -c 'while true; do /var/www/html/vendor/bin/drush oe-ai:subagents:sweep -q; /var/www/html/vendor/bin/drush queue:run oe_ai_assistant_subagent_task --time-limit=50 -q; /var/www/html/vendor/bin/drush queue:run oe_ai_assistant_subagent_delivery --time-limit=10 -q; sleep 2; done'"
    directory: /var/www/html
  - name: draft-group-worker-1
    command: "bash -c 'while true; do /var/www/html/vendor/bin/drush queue:run oe_ai_assistant_draft_group --items-limit=1 -q; sleep 1; done'"
    directory: /var/www/html
  - name: draft-group-worker-2
    command: "bash -c 'while true; do /var/www/html/vendor/bin/drush queue:run oe_ai_assistant_draft_group --items-limit=1 -q; sleep 1; done'"
    directory: /var/www/html
  - name: draft-group-worker-3
    command: "bash -c 'while true; do /var/www/html/vendor/bin/drush queue:run oe_ai_assistant_draft_group --items-limit=1 -q; sleep 1; done'"
    directory: /var/www/html
