# Disable FastCGI response buffering and gzip compression for SSE
# streaming endpoints. Without this, nginx buffers output for gzip
# compression and FastCGI buffering, causing SSE events to arrive
# in bursts instead of token-by-token.
#
# These are matched before Drupal's front controller rewrites the
# request to index.php, so they use a location block with an
# internal rewrite to index.php with fastcgi_buffering off and
# gzip off.
location ~ ^/api/ai/plugins/.*/(?:chat|stream)$ {
    try_files /index.php =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass unix:/run/php-fpm.sock;
    fastcgi_buffering off;
    gzip off;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_intercept_errors off;
    fastcgi_read_timeout 10m;
    fastcgi_param SERVER_NAME $host;
    fastcgi_param HTTPS $fcgi_https;
}
