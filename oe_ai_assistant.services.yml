services:
  _defaults:
    autoconfigure: true
    autowire: true

  # Logger channel.
  logger.channel.oe_ai_assistant:
    parent: logger.channel_base
    arguments: ['oe_ai_assistant']

  # Plugin manager.
  Drupal\oe_ai_assistant\Plugin\AiAssistantPluginManager:
    parent: default_plugin_manager

  # Dumps outgoing provider requests when settings.php asks for it.
  Drupal\oe_ai_assistant\Http\ProviderCallLogger:
    tags:
      - { name: http_client_middleware }

  Drupal\oe_ai_assistant\SchemaBuilder\DraftableFieldsBuilder: {}
  Drupal\oe_ai_assistant\SchemaBuilder\LangcodeBuilder: {}
  Drupal\oe_ai_assistant\SchemaBuilder\ModerationStateBuilder: {}
  Drupal\oe_ai_assistant\SchemaBuilder\TemplateFieldsBuilder: {}
  Drupal\oe_ai_assistant\SchemaBuilder\TemplateDefaultsBuilder: {}
  Drupal\oe_ai_assistant\SchemaBuilder\TemplateBundlesBuilder: {}

  Drupal\oe_ai_assistant\Service\TemplateDefaultsResolver: {}
  Drupal\oe_ai_assistant\Service\TemplateDefaultsResolverInterface: '@Drupal\oe_ai_assistant\Service\TemplateDefaultsResolver'

  Drupal\oe_ai_assistant\Service\RequestValidator: {}



  Drupal\oe_ai_assistant\Service\DraftingSchemaProvider: {}
  Drupal\oe_ai_assistant\Service\DraftingSchemaProviderInterface: '@Drupal\oe_ai_assistant\Service\DraftingSchemaProvider'

  Drupal\oe_ai_assistant\Service\AiEditorialContext: {}
  Drupal\oe_ai_assistant\Service\AiEditorialContextInterface: '@Drupal\oe_ai_assistant\Service\AiEditorialContext'

  Drupal\oe_ai_assistant\Service\Drafting\ContextDocumentRepository: {}

  Drupal\oe_ai_assistant\Service\TextFormatResolver: {}

  # Drives a document through extraction and summarisation.
  Drupal\oe_ai_assistant\Service\Drafting\DocumentExtractionProcessorInterface:
    class: Drupal\oe_ai_assistant\Service\Drafting\DocumentExtractionProcessor

  Drupal\oe_ai_assistant\Service\InlineEntityHydrator: {}

  Drupal\oe_ai_assistant\Service\DraftEntityBuilder: {}

  Drupal\oe_ai_assistant\Service\DraftAssembler: {}
  Drupal\oe_ai_assistant\Service\DraftAssemblerInterface: '@Drupal\oe_ai_assistant\Service\DraftAssembler'

  Drupal\oe_ai_assistant\Service\DraftSaver: {}
  Drupal\oe_ai_assistant\Service\DraftSaverInterface: '@Drupal\oe_ai_assistant\Service\DraftSaver'

  Drupal\oe_ai_assistant\Service\PreviewRenderer: {}
  Drupal\oe_ai_assistant\Service\PreviewRendererInterface: '@Drupal\oe_ai_assistant\Service\PreviewRenderer'


  # Overrides both of ai_neuron's own aliases, so every agent gets this store.
  Drupal\oe_ai_assistant\Neuron\Chat\History\EditorialMessageStore: {}
  Drupal\ai_neuron\Chat\History\ContextualMessageStoreInterface: '@Drupal\oe_ai_assistant\Neuron\Chat\History\EditorialMessageStore'
  NeuronAI\Chat\History\MessageStoreInterface: '@Drupal\oe_ai_assistant\Neuron\Chat\History\EditorialMessageStore'
