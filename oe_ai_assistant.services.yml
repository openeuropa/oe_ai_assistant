services:
  Drupal\oe_ai_assistant\Plugin\AiAssistantPluginManager:
    parent: default_plugin_manager

  Drupal\oe_ai_assistant\Service\RequestValidator: {}

  Drupal\oe_ai_assistant\Service\EntityJsonSchemaComposer:
    arguments:
      - '@serializer'
      - '@entity_type.manager'
      - '@entity_type.bundle.info'

  Drupal\oe_ai_assistant\Service\InlineEntityHydrator:
    arguments:
      - '@serializer'
      - '@entity_field.manager'
      - '@entity_type.manager'

  Drupal\oe_ai_assistant\Service\DraftEntityBuilder:
    arguments:
      - '@serializer'
      - '@entity_type.manager'
      - '@Drupal\oe_ai_assistant\Service\InlineEntityHydrator'

  Drupal\oe_ai_assistant\Service\AgentFactory:
    arguments:
      - '@ai.provider'
      - '@plugin.manager.ai.function_calls'
      - '@config.factory'
      - '@key.repository'

  Drupal\oe_ai_assistant\Service\AiEditorialSessionPluginStore:
    arguments:
      - '@entity_type.manager'

  oe_ai_assistant.ui_message_stream:
    class: Drupal\oe_ai_assistant\Service\UiMessageStream
    arguments:
      - '@ai.prompt_code_block_extractor'

  oe_ai_assistant.conversation_store_factory:
    class: Drupal\oe_ai_assistant\Store\ConversationStoreFactory
    arguments:
      - '@tempstore.private'
