# Shell-level schemas.
#
# Shared across all plugins: error envelope, state blob, and content
# type definitions. Referenced from the root openapi.yaml.

ApiError:
  type: object
  description: Standard error envelope returned by all error responses.
  required: [code, message]
  properties:
    code:
      type: string
      description: Machine-readable error code (e.g. "not_found").
    message:
      type: string
      description: Human-readable explanation.

AppStateBlob:
  type: object
  description: >
    Opaque JSON blob representing the full persisted application
    state. The backend stores it as-is and returns it verbatim.
    The shape is owned by the frontend Zustand store.
  additionalProperties: true

ContentTypeField:
  type: object
  description: Describes a single field within a content type.
  required: [name, label, type]
  properties:
    name:
      type: string
      description: Machine name (used as the key in content fields).
    label:
      type: string
      description: Human-readable label.
    type:
      type: string
      enum: [text, textarea, html, select, boolean, number]
      description: Field widget type.
    required:
      type: boolean
      description: Whether the field is required.
      default: false
    options:
      type: array
      description: Allowed values for select fields.
      items:
        type: object
        required: [value, label]
        properties:
          value:
            type: string
          label:
            type: string

ContentType:
  type: object
  description: >
    A content type definition. Tells the app which fields are
    available for a given type of content.
  required: [id, name, fields]
  properties:
    id:
      type: string
      description: Machine name (e.g. "article", "news_story").
    name:
      type: string
      description: Human-readable name.
    description:
      type: string
      description: Short explanation of the content type.
    fields:
      type: array
      description: Ordered list of fields the editor can fill.
      items:
        $ref: "#/ContentTypeField"

GetMessagesRequest:
  type: object
  description: >
    Load the persisted conversation transcript for an editorial session.
    Available on every plugin endpoint under /plugins/{pluginId}/get-messages.
  required:
    - sessionId
  properties:
    sessionId:
      type: string
      description: The editorial session whose transcript to load.

GetMessagesResponse:
  type: object
  required:
    - messages
  properties:
    messages:
      type: array
      description: The user-visible transcript, oldest first.
      items:
        type: object
        required:
          - role
        # Author attribution only exists on user turns, so neither field
        # can be required outright; they must however always travel as a
        # pair.
        dependentRequired:
          userName: [userId]
          userId: [userName]
        properties:
          role:
            type: string
            description: The message role ("user", "assistant" or "event").
          content:
            type: string
            description: The message text (user and assistant items).
          userName:
            type: string
            description: >
              Display name of the author (user items). Together with
              userId it attributes turns in shared sessions.
          userId:
            type: string
            description: >
              Stable CMS user id of the author (user items). Clients key
              participants by this id so two users sharing a display
              name stay distinct.
          type:
            type: string
            description: The event type, e.g. "session_start", "tone", "template" (event items).
          summary:
            type: string
            description: The human-readable event summary (event items).
          at:
            type: string
            description: RFC 3339 timestamp of the event (event items).
          version:
            type: integer
            description: The draft version a "save" event persisted (event items).
          toolCalls:
            type: array
            description: >
              The tool calls of an assistant turn, in the order the model
              made them.
            items:
              type: object
              required:
                - function
              properties:
                callId:
                  type: string
                  description: >
                    The id the editor's decision names. Sent only for a
                    call that is waiting for one.
                function:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      description: The machine name of the tool.
                    arguments:
                      type: string
                      description: The arguments the model gave the tool, as JSON.
                result:
                  description: >
                    What the call answered. Absent while the call waits for
                    the editor's decision.
                awaitingDecision:
                  type: boolean
                  description: >
                    The call waits for the editor's decision and carries no
                    result. Its card in the transcript asks the question.
