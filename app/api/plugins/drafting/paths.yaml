# Drafting plugin API paths.
#
# RPC-style endpoints that wrap the AG-UI backend controller.
# The chat endpoint returns an SSE stream of AG-UI events.

chat:
  post:
    operationId: postDraftingChat
    summary: Send a drafting message and receive AG-UI SSE stream
    tags: [Drafting]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/DraftingChatRequest"
    responses:
      "200":
        description: SSE stream of AG-UI protocol events
        content:
          text/event-stream: {}

reset:
  post:
    operationId: postDraftingReset
    summary: Reset the drafting conversation thread
    tags: [Drafting]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/DraftingResetRequest"
    responses:
      "200":
        description: Reset confirmation
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/DraftingResetResponse"

save:
  post:
    operationId: postDraftingSave
    summary: Save a session draft version as an unpublished node
    tags: [Drafting]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/DraftingSaveRequest"
    responses:
      "200":
        description: Created node details
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/DraftingSaveResponse"

setTone:
  post:
    operationId: postDraftingSetTone
    summary: Set selected drafting tone
    tags: [Drafting]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/DraftingSetToneRequest"
    responses:
      "200":
        description: Selected tone accepted
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/DraftingSetToneResponse"
      "400":
        description: Validation error.
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/ApiError"

setTemplate:
  post:
    operationId: postDraftingSetTemplate
    summary: Set the selected drafting template on the session
    tags: [Drafting]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/DraftingSetTemplateRequest"
    responses:
      "200":
        description: Set-template confirmation
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/DraftingSetTemplateResponse"
      "400":
        description: Validation error.
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/ApiError"

preview:
  post:
    operationId: postDraftingPreview
    summary: Render a themed HTML preview of a stored draft version, without saving
    tags: [Drafting]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/DraftingPreviewRequest"
    responses:
      "200":
        description: >
          A complete, standalone HTML document rendering the draft as the
          live site would show it. Not JSON: load it into an iframe via
          srcdoc or a blob URL — this action is POST-only, so an iframe's
          src attribute cannot address it directly. The rendered document
          contains LLM-authored content, so when it is eventually consumed
          in an iframe (OEL-4856), it should be sandboxed rather than given
          full same-origin trust via a bare srcdoc.
        content:
          text/html:
            schema:
              type: string
      "400":
        description: Validation error, unresolvable template, or invalid payload.
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/ApiError"
      "403":
        description: Missing create permission for the bundle.
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/ApiError"
      "404":
        description: The requested draft version was not found.
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/ApiError"
      "500":
        description: Rendering failed. See the system log for details.
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/ApiError"
