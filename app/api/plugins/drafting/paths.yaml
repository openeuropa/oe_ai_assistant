# Drafting plugin API paths.
#
# RPC-style endpoints that wrap the AG-UI backend controller.
# The chat endpoint returns an SSE stream of AG-UI events.

chat:
  post:
    operationId: postDraftingChat
    summary: Send a drafting message and receive AG-UI SSE stream
    tags: [Drafting]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/DraftingChatRequest"
    responses:
      "200":
        description: SSE stream of AG-UI protocol events
        content:
          text/event-stream: {}

reset:
  post:
    operationId: postDraftingReset
    summary: Reset the drafting conversation thread
    tags: [Drafting]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/DraftingResetRequest"
    responses:
      "200":
        description: Reset confirmation
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/DraftingResetResponse"

save:
  post:
    operationId: postDraftingSave
    summary: Save a session draft version as an unpublished node
    tags: [Drafting]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/DraftingSaveRequest"
    responses:
      "200":
        description: Created node details
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/DraftingSaveResponse"

setTone:
  post:
    operationId: postDraftingSetTone
    summary: Set selected drafting tone
    tags: [Drafting]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/DraftingSetToneRequest"
    responses:
      "200":
        description: Selected tone accepted
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/DraftingSetToneResponse"
      "400":
        description: Validation error.
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/ApiError"

setTemplate:
  post:
    operationId: postDraftingSetTemplate
    summary: Set the selected drafting template on the session
    tags: [Drafting]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/DraftingSetTemplateRequest"
    responses:
      "200":
        description: Set-template confirmation
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/DraftingSetTemplateResponse"
      "400":
        description: Validation error.
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/ApiError"

addDocument:
  post:
    operationId: postDraftingAddDocument
    summary: Upload a drafting context document
    description: >
      The file bytes form the raw request body. Session, category and
      filename are query parameters, exploded from the request schema.
    tags: [Drafting]
    parameters:
      - name: params
        in: query
        required: true
        style: form
        explode: true
        schema:
          $ref: "../../openapi.yaml#/components/schemas/DraftingAddDocumentRequest"
    requestBody:
      required: true
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
            description: The raw file bytes.
    responses:
      "200":
        description: Uploaded document details
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/DraftingAddDocumentResponse"
      "400":
        description: Validation error.
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/ApiError"
      "403":
        $ref: "../../openapi.yaml#/components/responses/Forbidden"

listDocuments:
  post:
    operationId: postDraftingListDocuments
    summary: List drafting context documents
    tags: [Drafting]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/DraftingListDocumentsRequest"
    responses:
      "200":
        description: Referenced documents for the current session
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/DraftingListDocumentsResponse"
      "400":
        description: Validation error.
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/ApiError"
      "403":
        $ref: "../../openapi.yaml#/components/responses/Forbidden"

removeDocument:
  post:
    operationId: postDraftingRemoveDocument
    summary: Remove a drafting context document
    tags: [Drafting]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/DraftingRemoveDocumentRequest"
    responses:
      "200":
        description: Removal confirmation
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/DraftingRemoveDocumentResponse"
      "400":
        description: Validation error.
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/ApiError"
      "403":
        $ref: "../../openapi.yaml#/components/responses/Forbidden"

extractDocument:
  post:
    operationId: postDraftingExtractDocument
    summary: Process a drafting context document
    description: >
      Runs text extraction and summarisation on a referenced document and
      returns its resulting status. Fired by the app after a successful
      upload and by the retry control. A document that is already being
      processed, or done, is left alone and its current status returned.
    tags: [Drafting]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/DraftingExtractDocumentRequest"
    responses:
      "200":
        description: The document status after processing
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/DraftingExtractDocumentResponse"
      "400":
        description: Validation error.
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/ApiError"
      "403":
        $ref: "../../openapi.yaml#/components/responses/Forbidden"
      "404":
        description: The document is not referenced by the session.
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/ApiError"

preview:
  get:
    operationId: getDraftingPreview
    summary: Render a themed HTML preview of a stored draft version, without saving
    tags: [Drafting]
    parameters:
      - name: sessionId
        in: query
        required: true
        schema:
          type: string
        description: The editorial session hosting the draft to preview.
      - name: version
        in: query
        required: true
        schema:
          type: integer
        description: >
          The draft version to render, as returned by get_draft_history /
          the draft_content result (e.g. 1 for "Draft 1").
    responses:
      "200":
        description: >
          A complete, standalone HTML document rendering the draft as the
          live site would show it. Not JSON: the action is a GET so an
          iframe can load it directly through its src attribute. The
          rendered document contains LLM-authored content, so consuming
          iframes should sandbox it (no script execution) rather than
          grant full same-origin trust.
        content:
          text/html:
            schema:
              type: string
      "400":
        description: Validation error, unresolvable template, or invalid payload.
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/ApiError"
      "403":
        description: Missing create permission for the bundle.
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/ApiError"
      "404":
        description: The requested draft version was not found.
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/ApiError"
      "500":
        description: Rendering failed. See the system log for details.
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/ApiError"
