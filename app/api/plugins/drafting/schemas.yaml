# Drafting plugin API schemas.
#
# Request/response types for the drafting endpoints.
# The SSE stream uses AG-UI protocol events (not defined here
# as they are a transport-level concern, not REST schemas).

DraftingChatRequest:
  type: object
  required:
    - message
    - sessionId
  properties:
    message:
      type: string
      description: The user's drafting prompt or instruction.
    sessionId:
      type: string
      description: >
        The editorial session that hosts the conversation. The backend
        derives the target content type and access from the session and
        persists every turn against it.
    template:
      type: string
      description: >
        Optional ai_drafting_template id selected by the user, from
        AppConfig.pluginConfig['drafting'].availableTemplates. When omitted
        or empty, the backend auto-selects the latest enabled template for
        the session's content type, or falls back to the full schema when
        none exists.

DraftingResetRequest:
  type: object
  required:
    - sessionId
  properties:
    sessionId:
      type: string
      description: The editorial session whose conversation to reset.

DraftingResetResponse:
  type: object
  required:
    - status
  properties:
    status:
      type: string
      description: Confirmation status (e.g. "ok").

DraftingSaveRequest:
  type: object
  required:
    - entityTypeId
    - bundle
    - fields
  properties:
    entityTypeId:
      type: string
      description: The entity type ID (e.g. "node").
    bundle:
      type: string
      description: The content type machine name (e.g. "oe_news").
    fields:
      type: object
      description: >
        The drafted field values, keyed by field machine name.
        Shape matches the content type form schema.

DraftingSaveResponse:
  type: object
  required:
    - nodeId
    - previewUrl
  properties:
    nodeId:
      type: string
      description: The ID of the created node.
    previewUrl:
      type: string
      description: URL to preview the created draft node.

DraftingSetToneRequest:
  type: object
  required:
    - sessionId
    - toneId
  properties:
    sessionId:
      type: string
      description: >
        The editorial session on which the selected tone is saved.
    toneId:
      type: string
      description: Selected tone taxonomy term ID.

DraftingSetToneResponse:
  type: object
  required:
    - status
  properties:
    status:
      type: string
      enum: [ok]
