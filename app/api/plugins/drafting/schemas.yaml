# Drafting plugin API schemas.
#
# Request/response types for the drafting endpoints.
# The SSE stream uses UI message stream events (not defined here
# as they are a transport-level concern, not REST schemas).

DraftingChatRequest:
  type: object
  required:
    - message
    - sessionId
  properties:
    message:
      type: string
      description: The user's drafting prompt or instruction.
    sessionId:
      type: string
      description: >
        The editorial session that hosts the conversation. The backend
        derives the target content type and access from the session and
        persists every turn against it.

DraftingResetRequest:
  type: object
  required:
    - sessionId
  properties:
    sessionId:
      type: string
      description: The editorial session whose conversation to reset.

DraftingResetResponse:
  type: object
  required:
    - status
  properties:
    status:
      type: string
      description: Confirmation status (e.g. "ok").

DraftingGetApprovalsRequest:
  type: object
  description: >
    Read the tool calls of the session that are waiting on the editor's
    decision. A gated call suspends the run until it is answered, and the
    run is durable, so a reload reads the request back rather than losing
    it.
  required:
    - sessionId
  properties:
    sessionId:
      type: string
      description: The editorial session holding the suspended run.

DraftingGetApprovalsResponse:
  type: object
  required:
    - approvals
  properties:
    approvals:
      type: array
      description: The pending calls, empty when the run waits for nothing.
      items:
        $ref: "../../openapi.yaml#/components/schemas/DraftingApproval"

DraftingApproval:
  type: object
  description: One tool call awaiting a decision.
  required:
    - id
    - name
  properties:
    id:
      type: string
      description: The tool call id, which names the call in a decision.
    name:
      type: string
      description: The tool the model asked to run.
    description:
      type: string
      nullable: true
      description: What the tool does, as the model reads it.
    decision:
      type: string
      description: The current state of the decision.
    feedback:
      type: string
      nullable: true
      description: What the editor said when rejecting the call.
    reason:
      type: string
      nullable: true
      description: Why the call needs a decision, declared by the tool.
    inputs:
      type: object
      additionalProperties: true
      description: The arguments the call would run with.

DraftingSubmitApprovalRequest:
  type: object
  description: >
    Answer one waiting tool call. Approving runs it and streams the rest of
    the turn; rejecting skips it and tells the model why.
  required:
    - sessionId
    - callId
    - decision
  properties:
    sessionId:
      type: string
      description: The editorial session holding the suspended run.
    callId:
      type: string
      description: The tool call being answered.
    decision:
      type: string
      enum:
        - approve
        - reject
      description: The editor's decision.
    reason:
      type: string
      description: >
        Why the call was rejected, which reaches the model so it can say
        what was turned down. Ignored on an approval.

DraftingSetToneRequest:
  type: object
  required:
    - sessionId
    - toneId
  properties:
    sessionId:
      type: string
      description: >
        The editorial session on which the selected tone is saved.
    toneId:
      type: string
      description: Selected tone taxonomy term ID.

DraftingSetToneResponse:
  type: object
  required:
    - status
  properties:
    status:
      type: string
      enum: [ok]

DraftingSetTemplateRequest:
  type: object
  required:
    - sessionId
    - template
  properties:
    sessionId:
      type: string
      description: >
        The editorial session on which the selected template is saved.
    template:
      type: string
      description: >
        The ai_drafting_template id to select, from
        pluginConfig.drafting.templates.options. The template field is
        mandatory, so an empty value is rejected.

DraftingSetTemplateResponse:
  type: object
  required:
    - status
  properties:
    status:
      type: string
      enum: [ok]

DraftingDocumentCategory:
  type: string
  enum: [context]
  description: >
    Document category. The backend derives the session field, media bundle,
    and storage details from this category.

DraftingDocumentStatus:
  type: string
  description: >
    Extraction state of a document. Scheduled, extracting, extracted and
    summarizing are transient; done and error are final. Error can be
    retried with extract-document.
  enum: [scheduled, extracting, extracted, summarizing, done, error]

DraftingDocument:
  type: object
  required:
    - id
    - title
    - status
    - meta
  properties:
    id:
      type: string
      description: Server-assigned media entity ID.
    title:
      type: string
      description: Document title or original filename.
    status:
      $ref: "../../openapi.yaml#/components/schemas/DraftingDocumentStatus"
    meta:
      type: object
      required:
        - type
        - size
      properties:
        type:
          type: string
          description: Lowercase file extension or generic file type.
        size:
          type: integer
          description: File size in bytes.

DraftingDocumentSnapshot:
  description: >
    A document as captured in the provenance snapshot of a draft, stored
    under context.documents of the draft_content tool result. Extends the
    listed document with its category and the summary produced by the
    extraction pipeline, so a draft records the material that steered it
    even after the document is removed from the session.
  allOf:
    - $ref: "../../openapi.yaml#/components/schemas/DraftingDocument"
    - type: object
      required:
        - category
        - summary
      properties:
        category:
          $ref: "../../openapi.yaml#/components/schemas/DraftingDocumentCategory"
        summary:
          type: string
          description: Summary produced by the extraction pipeline; empty until available.

DraftingAddDocumentRequest:
  type: object
  description: >
    Query parameters of the add-document upload. The file bytes form the
    raw request body, so these fields travel in the query string.
  required:
    - sessionId
    - category
    - filename
  properties:
    sessionId:
      type: string
      description: The editorial session receiving the uploaded document.
    category:
      $ref: "../../openapi.yaml#/components/schemas/DraftingDocumentCategory"
    filename:
      type: string
      minLength: 1
      description: Client filename of the uploaded document, including its extension.

DraftingAddDocumentResponse:
  type: object
  required:
    - document
  properties:
    document:
      $ref: "../../openapi.yaml#/components/schemas/DraftingDocument"

DraftingListDocumentsRequest:
  type: object
  required:
    - sessionId
    - category
  properties:
    sessionId:
      type: string
      description: The editorial session whose documents should be listed.
    category:
      $ref: "../../openapi.yaml#/components/schemas/DraftingDocumentCategory"

DraftingListDocumentsResponse:
  type: object
  required:
    - documents
  properties:
    documents:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/DraftingDocument"

DraftingRemoveDocumentRequest:
  type: object
  required:
    - sessionId
    - category
    - documentId
  properties:
    sessionId:
      type: string
      description: The editorial session the document belongs to.
    category:
      $ref: "../../openapi.yaml#/components/schemas/DraftingDocumentCategory"
    documentId:
      type: string
      description: Server-assigned document ID to remove.

DraftingRemoveDocumentResponse:
  type: object
  required:
    - status
  properties:
    status:
      type: string
      enum: [ok]

DraftingExtractDocumentRequest:
  type: object
  required:
    - sessionId
    - category
    - documentId
  properties:
    sessionId:
      type: string
      description: The editorial session the document belongs to.
    category:
      $ref: "../../openapi.yaml#/components/schemas/DraftingDocumentCategory"
    documentId:
      type: string
      description: Server-assigned document ID to process.

DraftingExtractDocumentResponse:
  type: object
  required:
    - status
  properties:
    status:
      $ref: "../../openapi.yaml#/components/schemas/DraftingDocumentStatus"
