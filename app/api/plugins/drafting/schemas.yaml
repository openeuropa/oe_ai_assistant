# Drafting plugin API schemas.
#
# Request/response types for the drafting endpoints.
# The SSE stream uses AG-UI protocol events (not defined here
# as they are a transport-level concern, not REST schemas).

DraftingChatRequest:
  type: object
  required:
    - message
    - sessionId
  properties:
    message:
      type: string
      description: The user's drafting prompt or instruction.
    sessionId:
      type: string
      description: >
        The editorial session that hosts the conversation. The backend
        derives the target content type and access from the session and
        persists every turn against it.

DraftingResetRequest:
  type: object
  required:
    - sessionId
  properties:
    sessionId:
      type: string
      description: The editorial session whose conversation to reset.

DraftingResetResponse:
  type: object
  required:
    - status
  properties:
    status:
      type: string
      description: Confirmation status (e.g. "ok").

DraftingSaveRequest:
  type: object
  description: >
    Save one of the session's drafts as an unpublished revision. The
    backend resolves the target content type and the drafted field
    values from the session and its draft history, so the client only
    names the version being saved; a client can never save field data
    the session did not produce.
  required:
    - sessionId
    - version
  properties:
    sessionId:
      type: string
      description: The editorial session that owns the draft.
    version:
      type: integer
      description: >
        The draft version to save, matching the version of a
        draft_content result in the session transcript (the version
        shown in the artifact pane and the version rail).

DraftingSaveResponse:
  type: object
  required:
    - nodeId
    - previewUrl
  properties:
    nodeId:
      type: string
      description: The ID of the created node.
    previewUrl:
      type: string
      description: URL to preview the created draft node.

DraftingSetToneRequest:
  type: object
  required:
    - sessionId
    - toneId
  properties:
    sessionId:
      type: string
      description: >
        The editorial session on which the selected tone is saved.
    toneId:
      type: string
      description: Selected tone taxonomy term ID.

DraftingSetToneResponse:
  type: object
  required:
    - status
  properties:
    status:
      type: string
      enum: [ok]

DraftingSetTemplateRequest:
  type: object
  required:
    - sessionId
    - template
  properties:
    sessionId:
      type: string
      description: >
        The editorial session on which the selected template is saved.
    template:
      type: string
      description: >
        The ai_drafting_template id to select, from
        pluginConfig.drafting.templates.options. The template field is
        mandatory, so an empty value is rejected.

DraftingSetTemplateResponse:
  type: object
  required:
    - status
  properties:
    status:
      type: string
      enum: [ok]

DraftingDocumentCategory:
  type: string
  enum: [context]
  description: >
    Document category. The backend derives the session field, media bundle,
    and storage details from this category.

DraftingDocument:
  type: object
  required:
    - id
    - title
    - meta
  properties:
    id:
      type: string
      description: Server-assigned media entity ID.
    title:
      type: string
      description: Document title or original filename.
    meta:
      type: object
      required:
        - type
        - size
      properties:
        type:
          type: string
          description: Lowercase file extension or generic file type.
        size:
          type: string
          description: Human-readable file size.

DraftingAddDocumentRequest:
  type: object
  required:
    - sessionId
    - category
    - file
  properties:
    sessionId:
      type: string
      description: The editorial session receiving the uploaded document.
    category:
      $ref: "../../openapi.yaml#/components/schemas/DraftingDocumentCategory"
    file:
      type: string
      format: binary
      description: Uploaded document file.

DraftingAddDocumentResponse:
  type: object
  required:
    - document
  properties:
    document:
      $ref: "../../openapi.yaml#/components/schemas/DraftingDocument"

DraftingListDocumentsRequest:
  type: object
  required:
    - sessionId
    - category
  properties:
    sessionId:
      type: string
      description: The editorial session whose documents should be listed.
    category:
      $ref: "../../openapi.yaml#/components/schemas/DraftingDocumentCategory"

DraftingListDocumentsResponse:
  type: object
  required:
    - documents
  properties:
    documents:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/DraftingDocument"

DraftingRemoveDocumentRequest:
  type: object
  required:
    - sessionId
    - category
    - documentId
  properties:
    sessionId:
      type: string
      description: The editorial session that references the document.
    category:
      $ref: "../../openapi.yaml#/components/schemas/DraftingDocumentCategory"
    documentId:
      type: string
      description: Server-assigned document ID to remove.

DraftingRemoveDocumentResponse:
  type: object
  required:
    - status
  properties:
    status:
      type: string
      enum: [ok]
