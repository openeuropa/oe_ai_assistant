services:
  _defaults:
    autowire: true

  # Logger channel.
  logger.channel.document_loader_tika:
    parent: logger.channel_base
    arguments: ['document_loader_tika']

  # Mode-selecting client shared by the loader plugin and status report.
  Drupal\document_loader_tika\TikaClient: ~

  Drupal\document_loader_tika\TikaClientInterface: '@Drupal\document_loader_tika\TikaClient'

  Drupal\document_loader_tika\TikaServerClient: ~

  Drupal\document_loader_tika\TikaExecutableClient: ~
