name: CI

on:
  pull_request:

jobs:
  drupal-lint:
    name: Drupal Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start DDEV
        uses: ddev/github-action-setup-ddev@v1

      - name: Install dependencies
        run: |
          ddev poser
          export PROJECT_FILES=$(ls -A)
          ddev symlink-project

      - name: Check Drupal core package versions
        run: |
          installed=$(ddev composer show --format=json)
          versions=""
          for package in drupal/core drupal/core-recommended drupal/core-dev drupal/core-composer-scaffold; do
            version=$(echo "$installed" | jq -r --arg name "$package" '.installed[] | select(.name == $name) | .version')
            if [ -z "$version" ]; then
              echo "::error::$package is not installed."
              exit 1
            fi
            echo "$package: $version"
            versions+="$version"$'\n'
          done
          if [ "$(printf '%s' "$versions" | sort -u | wc -l)" -ne 1 ]; then
            echo "::error::Drupal core packages are installed with different versions."
            exit 1
          fi

      - name: Check coding standards
        run: ddev phpcs .

  drupal-test:
    name: Drupal Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start DDEV
        uses: ddev/github-action-setup-ddev@v1

      - name: Set up environment
        run: cp .ddev/.env.dist .ddev/.env

      - name: Build site
        run: ddev rebuild

      - name: Run tests
        run: ddev phpunit

  app-lint:
    name: App Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  app-test:
    name: App Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npx playwright test
