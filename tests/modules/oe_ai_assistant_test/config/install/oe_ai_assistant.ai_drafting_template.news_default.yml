langcode: en
status: true
dependencies:
  config:
    - workflows.workflow.editorial
    - node.type.oe_news
  module:
    - oe_ai_assistant
id: news_default
label: 'News article (default)'
description: 'Standard news article with title, teaser, and body.'
content_type: oe_news
fields:
  title:
    prompt: 'News headline. Factual, concise, max 80 characters.'
  field_teaser:
    prompt: '2-3 sentence summary. Lead with the key fact.'
  field_body:
    prompt: 'Full article body, 3-5 paragraphs. Inverted pyramid structure.'
defaults:
  langcode:
    type: language
    default_value:
      - value: en
  moderation_state:
    type: string
    default_value:
      - value: draft
