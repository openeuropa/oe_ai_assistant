langcode: en
status: true
dependencies:
  config:
    - node.type.oe_news
  module:
    - content_moderation
    - node
id: editorial
label: Editorial
type: content_moderation
type_settings:
  states:
    draft:
      label: Draft
      published: false
      default_revision: false
      weight: 0
    published:
      label: Published
      published: true
      default_revision: true
      weight: 1
  transitions:
    create_new_draft:
      label: 'Create New Draft'
      from:
        - draft
        - published
      to: draft
      weight: 0
    publish:
      label: Publish
      from:
        - draft
      to: published
      weight: 1
  entity_types:
    node:
      - oe_news
