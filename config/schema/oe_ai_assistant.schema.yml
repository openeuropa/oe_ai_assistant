oe_ai_assistant.content_schema:
  type: config_object
  label: 'AI Assistant content schema settings'
  mapping:
    field_whitelist:
      type: sequence
      label: 'Per-content-type field whitelist'
      sequence:
        type: sequence
        label: 'Field names'
        sequence:
          type: string
          label: 'Field name'

oe_ai_assistant.ai_editorial_session_type.*:
  type: config_entity
  label: 'AI editorial session type'
  mapping:
    id:
      type: machine_name
      label: 'ID'
    label:
      type: label
      label: 'Label'
    uuid:
      type: uuid
      label: 'UUID'
