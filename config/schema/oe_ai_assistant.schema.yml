
oe_ai_assistant.ai_editorial_session_type.*:
  type: config_entity
  label: 'AI editorial session type'
  mapping:
    id:
      type: machine_name
      label: 'ID'
    label:
      type: label
      label: 'Label'
    uuid:
      type: uuid
      label: 'UUID'

oe_ai_assistant.ai_drafting_template.*:
  type: config_entity
  label: 'AI Drafting Template'
  mapping:
    id:
      type: string
      label: ID
    label:
      type: label
      label: Label
    uuid:
      type: string
      label: UUID
    status:
      type: boolean
      label: Status
    description:
      type: string
      label: Description
    content_type:
      type: string
      label: 'Content type'
    fields:
      type: ignore
      label: 'Field definitions'
    defaults:
      type: ignore
      label: 'Default values'

oe_ai_assistant.ai_drafting_template.field:
  type: mapping
  label: 'Field definition'
  mapping:
    prompt:
      requiredKey: false
      type: text
      label: 'Prompt'
    default_value:
      requiredKey: false
      type: sequence
      label: 'Default values'
      sequence:
        type: ignore
        label: 'Default value'
    items:
      requiredKey: false
      type: sequence
      label: 'Reference items'
      sequence:
        type: oe_ai_assistant.ai_drafting_template.reference_item
        label: 'Reference item'

oe_ai_assistant.ai_drafting_template.reference_item:
  type: mapping
  label: 'Reference item'
  mapping:
    entity_type:
      type: string
      label: 'Entity type'
    bundle:
      type: string
      label: 'Bundle'
    prompt:
      requiredKey: false
      type: text
      label: 'Prompt'
    fields:
      requiredKey: false
      type: sequence
      label: 'Nested field definitions'
      sequence:
        type: oe_ai_assistant.ai_drafting_template.field
        label: 'Field definition'

oe_ai_assistant.ai_drafting_template.default:
  type: mapping
  label: 'Default value'
  mapping:
    default_value:
      requiredKey: false
      type: sequence
      label: 'Default values'
      sequence:
        type: ignore
        label: 'Default value'
